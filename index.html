<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizador Flotante</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #workspace {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      .panel {
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 16px;
        z-index: 20;
        pointer-events: auto;
        display: flex;
        gap: 8px;
        width: 400px;
        max-width: 90%;
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
      }
      input {
        flex: 1;
        background-color: #0f172a;
        border: 1px solid #334155;
        color: #f8fafc;
        padding: 8px 12px;
        border-radius: 6px;
        outline: none;
        font-size: 14px;
      }
      input:focus {
        border-color: #6366f1;
      }
      button {
        background-color: #6366f1;
        color: #ffffff;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
      }
      button:hover {
        background-color: #4f46e5;
      }

      /* Ventana Flotante */
      .floating-window {
        position: absolute;
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        pointer-events: auto;
        z-index: 100;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .floating-window.focused {
        border-color: #6366f1;
      }
      .window-header {
        height: 36px;
        background-color: #0f172a;
        border-bottom: 1px solid #334155;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 12px;
        cursor: move;
        user-select: none;
      }
      .window-title {
        font-size: 12px;
        color: #94a3b8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: calc(100% - 30px);
      }
      .close-btn {
        background: none;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        font-size: 14px;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }
      .close-btn:hover {
        background-color: #ef4444;
        color: #ffffff;
      }
      .window-body {
        position: relative;
        flex: 1;
        background-color: #ffffff;
      }
      .shield {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        display: none;
        z-index: 50;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
      .resize-se {
        position: absolute;
        bottom: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        cursor: se-resize;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #94a3b8;
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 50%;
        user-select: none;
      }
      .resize-se:hover {
        color: #6366f1;
      }
    </style>
  </head>
  <body>

    <div id="workspace"></div>

    <div class="panel">
      <input type="text" id="url" placeholder="Escribe o pega una URL..." required autocomplete="off" />
      <button onclick="launch()">Abrir</button>
    </div>

    <script>
      let winCount = 0;
      let topZ = 100;

      function cleanURL(url) {
        let u = url.trim();
        if (!u) return '';
        if (!/^https?:\/\//i.test(u)) {
          u = 'https://' + u;
        }
        return u;
      }

      function launch() {
        const urlInput = document.getElementById('url');
        const url = cleanURL(urlInput.value);
        if (!url) return;

        const w = 800;
        const h = 600;

        winCount++;
        topZ += 5;

        const win = document.createElement('div');
        const winId = `win-${winCount}`;
        win.id = winId;
        win.className = 'floating-window focused';
        
        document.querySelectorAll('.floating-window').forEach(w => w.classList.remove('focused'));

        const offset = (winCount % 8) * 20;
        win.style.width = `${w}px`;
        win.style.height = `${h}px`;
        win.style.left = `${40 + offset}px`;
        win.style.top = `${40 + offset}px`;
        win.style.zIndex = topZ;

        win.innerHTML = `
          <div class="window-header" onmousedown="focusWin('${winId}')" ontouchstart="focusWin('${winId}')">
            <span class="window-title">${url}</span>
            <button class="close-btn" onclick="document.getElementById('${winId}').remove()" onmousedown="event.stopPropagation()">✕</button>
          </div>
          <div class="window-body">
            <div class="shield" id="${winId}-shield"></div>
            <iframe src="${url}" referrerpolicy="no-referrer"></iframe>
          </div>
          <div class="resize-se" onmousedown="startResize(event, '${winId}')" ontouchstart="startResize(event, '${winId}')">↘</div>
        `;

        setupDrag(win);

        win.addEventListener('mousedown', () => focusWin(winId));
        win.addEventListener('touchstart', () => focusWin(winId), { passive: true });

        document.getElementById('workspace').appendChild(win);
      }

      function focusWin(id) {
        const w = document.getElementById(id);
        if (w && !w.classList.contains('focused')) {
          document.querySelectorAll('.floating-window').forEach(win => win.classList.remove('focused'));
          w.classList.add('focused');
          topZ += 1;
          w.style.zIndex = topZ;
        }
      }

      function setupDrag(win) {
        const header = win.querySelector('.window-header');
        let dx = 0, dy = 0, px = 0, py = 0;

        header.onmousedown = dragStart;
        header.ontouchstart = dragStart;

        function dragStart(e) {
          if (e.target.closest('.close-btn')) return;
          e = e || window.event;
          const isTouch = e.type === 'touchstart';
          px = isTouch ? e.touches[0].clientX : e.clientX;
          py = isTouch ? e.touches[0].clientY : e.clientY;

          const shield = document.getElementById(`${win.id}-shield`);
          if (shield) shield.style.display = 'block';

          if (isTouch) {
            document.ontouchend = dragEnd;
            document.ontouchmove = dragMove;
          } else {
            document.onmouseup = dragEnd;
            document.onmousemove = dragMove;
          }
          focusWin(win.id);
        }

        function dragMove(e) {
          e = e || window.event;
          const isTouch = e.type === 'touchmove';
          const cx = isTouch ? e.touches[0].clientX : e.clientX;
          const cy = isTouch ? e.touches[0].clientY : e.clientY;

          dx = px - cx;
          dy = py - cy;
          px = cx;
          py = cy;

          let newLeft = win.offsetLeft - dx;
          let newTop = win.offsetTop - dy;

          newLeft = Math.max(-win.offsetWidth + 80, Math.min(newLeft, window.innerWidth - 80));
          newTop = Math.max(0, Math.min(newTop, window.innerHeight - 30));

          win.style.left = `${newLeft}px`;
          win.style.top = `${newTop}px`;
        }

        function dragEnd() {
          const shield = document.getElementById(`${win.id}-shield`);
          if (shield) shield.style.display = 'none';

          document.onmouseup = null;
          document.onmousemove = null;
          document.ontouchend = null;
          document.ontouchmove = null;
        }
      }

      let resizeTargetId = null;
      let startW = 0, startH = 0, sX = 0, sY = 0;

      function startResize(e, id) {
        e = e || window.event;
        e.preventDefault();
        e.stopPropagation();

        resizeTargetId = id;
        const win = document.getElementById(id);
        const isTouch = e.type === 'touchstart';
        sX = isTouch ? e.touches[0].clientX : e.clientX;
        sY = isTouch ? e.touches[0].clientY : e.clientY;
        startW = win.offsetWidth;
        startH = win.offsetHeight;

        const shield = document.getElementById(`${id}-shield`);
        if (shield) shield.style.display = 'block';

        if (isTouch) {
          document.addEventListener('touchmove', handleResize, { passive: false });
          document.addEventListener('touchend', stopResize, { passive: true });
        } else {
          document.addEventListener('mousemove', handleResize);
          document.addEventListener('mouseup', stopResize);
        }
        focusWin(id);
      }

      function handleResize(e) {
        if (!resizeTargetId) return;
        const win = document.getElementById(resizeTargetId);
        const isTouch = e.type === 'touchmove';
        const cx = isTouch ? e.touches[0].clientX : e.clientX;
        const cy = isTouch ? e.touches[0].clientY : e.clientY;

        const newW = Math.max(200, startW + (cx - sX));
        const newH = Math.max(150, startH + (cy - sY));
        
        win.style.width = `${newW}px`;
        win.style.height = `${newH}px`;
      }

      function stopResize() {
        if (resizeTargetId) {
          const shield = document.getElementById(`${resizeTargetId}-shield`);
          if (shield) shield.style.display = 'none';
        }
        resizeTargetId = null;
        document.removeEventListener('mousemove', handleResize);
        document.removeEventListener('mouseup', stopResize);
        document.removeEventListener('touchmove', handleResize);
        document.removeEventListener('touchend', stopResize);
      }
    </script>
  </body>
</html>
